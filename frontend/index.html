<!doctype html>
<html lang="pt-BR" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="On Perfumaria - Loja premium de perfumes importados e arabes" />
    <meta name="theme-color" content="#fafaf8" />
    <link rel="manifest" href="/manifest.json" />
    <title>On Perfumaria</title>
    <script>
      (function() {
        var theme = localStorage.getItem('theme')
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#171412')
        }
      })()
    </script>
  </head>
  <body class="bg-[#fafaf8] text-stone-900 dark:bg-[#171412] dark:text-stone-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
