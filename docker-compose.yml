services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onperfumaria-app
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/onperfumaria?sslmode=disable
      JWT_SECRET: change-me-in-production
      FRONTEND_URL: http://localhost:8080
      AUTO_SEED: "true"
      DEFAULT_TAX_FEE: 4.5
      POSTGRES_DB: onperfumaria
      POSTGRES_USER: postgres
      PGDATA: /var/lib/postgresql/data
    ports:
      - "8080:8080"
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
