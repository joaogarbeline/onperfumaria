services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onperfumaria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/onperfumaria?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: https://perfumes.performancetriade.com.br
      AUTO_SEED: "true"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEFAULT_TAX_FEE: 4.5
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  postgres_data:
